name: Paid project access
description: Ask about the US$19 personal-use digital project package.
title: "[Access] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        This request is public. Do not include payment details, addresses or private information.
        Personal-use access costs US$19 as a one-time purchase. This form is not checkout or delivery; a request does not activate access.
        DETENT D25 is a development prototype without a validated load rating.
  - type: input
    id: public_name
    attributes:
      label: Public maker name
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: Intended personal use
      description: Describe the laptop and printer in general terms. No private information.
    validations:
      required: true
